version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mercado-solidario-db
    environment:
      POSTGRES_DB: mercado_solidario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mercado-solidario-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mercado-solidario-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/mercado_solidario
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mercado-solidario-network
    volumes:
      - ./backend:/app
      - /app/target

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mercado-solidario-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - mercado-solidario-network

volumes:
  postgres_data:

networks:
  mercado-solidario-network:
    driver: bridge
