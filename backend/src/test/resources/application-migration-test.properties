spring.application.name=mercado-solidario-migration-test
spring.datasource.url=jdbc:h2:mem:migrationtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-h2
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.main.banner-mode=off
logging.level.org.flywaydb=INFO
