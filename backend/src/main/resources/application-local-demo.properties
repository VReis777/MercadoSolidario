server.address=127.0.0.1
app.frontend-base-url=http://127.0.0.1:5173
app.user-management.owner-username=${LOCAL_DEMO_ADMIN_USERNAME:}
spring.datasource.url=jdbc:h2:mem:mercado_solidario_local_demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-h2
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
