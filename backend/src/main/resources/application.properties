# Application Configuration
spring.application.name=mercado-solidario
server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mercado_solidario}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-postgresql
spring.flyway.baseline-on-migrate=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production-minimum-256-bits}
# Session length: 120 hours (120 * 3600 * 1000 ms)
jwt.expiration=${JWT_EXPIRATION:432000000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://localhost:3000}

# Frontend URL used in password links (HTTPS required outside loopback).
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://127.0.0.1:5173}
app.user-management.owner-username=${USER_MANAGEMENT_OWNER_USERNAME:${INITIAL_ADMIN_EMAIL:}}

# New profiles start with this temporary password; it never grants access by itself:
# logging in with it only sends a single-use change link to the profile's e-mail.
app.users.temporary-password=${USER_TEMPORARY_PASSWORD:senh@123}
app.users.password-link-minutes=${PASSWORD_LINK_MINUTES:30}

# Initial administrator, created once at startup if the e-mail does not exist yet (never resets passwords).
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.initial-admin.name=${INITIAL_ADMIN_NAME:}

# SMTP Configuration (Gmail)
# Configure these as environment variables on Windows
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:mevammercadosolidario@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Mail is only sent when MAIL_ENABLED=true and MAIL_PASSWORD is set (Gmail app password).
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:mevammercadosolidario@gmail.com}
# E-mail que recebe aviso quando alguém solicita atendimento (vazio = usa o remetente).
app.mail.notify=${MAIL_NOTIFY:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Logging
logging.level.com.mercadosolidario=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Donation guardrail; can be overridden in deployment configuration.
donations.maximum-amount=${DONATIONS_MAXIMUM_AMOUNT:100000.00}
